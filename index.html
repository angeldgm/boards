<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boards</title>

    <style>
        :root {
            color-scheme: light;
            --background: #f3f5fa;
            --surface: #ffffff;
            --surface-muted: #f7f8fc;
            --border: #dfe3ec;
            --text: #1d2433;
            --muted: #697386;
            --primary: #5865e8;
            --primary-hover: #4652d4;
            --danger: #c9364f;
            --shadow: 0 12px 30px rgb(32 42 68 / 8%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: white;
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        html.dark {
            filter: invert(1) hue-rotate(180deg);
        }

        html.dark img,
        html.dark video,
        html.dark canvas,
        html.dark picture {
            filter: invert(1) hue-rotate(180deg);
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        [hidden] {
            display: none !important;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .toolbar {
            display: flex;
            /* position: sticky; */
            position: fixed;
            /* top: 0; */
            bottom: 0;
            border-radius: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            align-items: center;
            gap: 1rem;
            padding: 0.85rem 1.25rem;
            background: rgb(255 255 255 / 92%);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            font-size: 1.05rem;
            font-weight: 750;
            white-space: nowrap;
        }

        .brand-icon {
            display: grid;
            width: 2rem;
            height: 2rem;
            place-items: center;
            color: white;
            background: var(--primary);
            border-radius: 0.65rem;
        }

        /* .board-picker {
            display: 1;
            min-width: 0;
            align-items: center;
            gap: 0.55rem;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 650;
        }

        .board-picker select {
            min-width: 5rem;
            max-width: 10rem;
            padding: 0.55rem 2rem 0.55rem 0.7rem;
            color: var(--text);
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: 0.6rem;
        } */

        .board-picker {
            position: relative;
            display: inline-block;
        }

        #board-menu-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border: none;
            background: transparent;
            cursor: pointer;
            color: inherit;
        }

        #board-menu-button:hover {
            background: #eee;
            border-radius: 6px;
        }

        .board-menu {
            position: absolute;
            bottom: 100%;
            left: 0;
            z-index: 1000;
            min-width: 180px;
            margin: 4px 0 0;
            padding: 4px;
            list-style: none;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgb(0 0 0 / 12%);
        }

        .board-menu li {
            padding: 10px 12px;
            cursor: pointer;
            border-radius: 4px;
        }

        .board-menu li:hover,
        .board-menu li[aria-selected="true"] {
            background: #eee;
        }

        .toolbar-actions,
        .board-actions,
        .composer-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toolbar-actions-item {
            display: inline-block;
        }

        .toolbar-actions {
            margin-left: auto;
        }

        .app-shell {
            width: min(1500px, 100%);
            margin: 0 auto;
            padding: 1.5rem 0rem 3rem;
        }

        .board-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            padding: 0rem 1.25rem 1.25rem;
        }

        .board-name {
            width: min(36rem, 100%);
            padding: 0;
            color: var(--text);
            background: transparent;
            border: 0;
            outline: 0;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 780;
        }

        .board-name:focus {
            border-bottom: 2px solid var(--primary);
        }

        .hint {
            margin: 0.35rem 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .board-menu {
            max-height: 500px;
            overflow: scroll;
        }

        .board-menu::-webkit-scrollbar {
            display: none;
        }

        .button {
            padding: 0.55rem 0.8rem;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.65rem;
            font-weight: 650;
        }

        .button:hover:not(:disabled) {
            background: var(--surface-muted);
        }

        .button.primary {
            color: white;
            background: var(--primary);
            border-color: var(--primary);
        }

        .button.primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .button.danger {
            color: var(--danger);
        }

        .button.small {
            padding: 0.35rem 0.55rem;
            font-size: 0.8rem;
            border: none;
            opacity: 0.2;
        }

        .editor-toolbar .active {
            background-color: black;
            color: white;
        }

        .columns {
            display: flex;
            align-items: flex-start;
            min-height: 20rem;
            padding-bottom: 1rem;
            overflow-x: auto;
        }

        .column {
            flex: 0 0 350px;
            max-width: 100%;
            padding: 0.9rem;
            background: #e9ecf5;
            border: 1px solid #dde1ed;
            border-radius: 1.15rem;
            box-shadow: var(--shadow);
        }

        .column-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .column-title {
            min-width: 0;
            flex: 1;
            padding: 0.35rem 0.2rem;
            color: var(--text);
            background: transparent;
            border: 0;
            border-bottom: 1px solid transparent;
            outline: 0;
            font-size: 1rem;
            font-weight: 750;
        }

        .column-title:focus {
            border-bottom-color: var(--primary);
        }

        .item-list {
            min-height: 3rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .empty-column {
            padding: 1.25rem 0.5rem;
            color: var(--muted);
            text-align: center;
            font-size: 0.88rem;
        }

        .item {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: start;
            gap: 0.55rem;
            margin-bottom: 0.65rem;
            padding: 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.85rem;
            box-shadow: 0 3px 10px rgb(32 42 68 / 4%);
        }

        .item.dragging {
            opacity: 0.35;
        }

        .drag-handle {
            padding: 0.15rem;
            color: #9199aa;
            background: transparent;
            border: 0;
            cursor: grab;
            font-size: 1.1rem;
            line-height: 1.2;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .item-body {
            min-width: 0;
        }

        .item-actions {
            display: flex;
            gap: 0.25rem;
        }

        .rich-content {
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .rich-content > :first-child {
            margin-top: 0;
        }

        .rich-content > :last-child {
            margin-bottom: 0;
        }

        .rich-content a,
        .editor a {
            color: var(--primary);
        }

        .photo-preview {
            margin: 0;
        }

        .photo-preview img {
            display: block;
            width: 100%;
            max-height: 22rem;
            object-fit: contain;
            background: #eef0f5;
            border-radius: 0.65rem;
        }

        .photo-preview figcaption {
            margin-top: 0.4rem;
            color: var(--muted);
            font-size: 0.78rem;
        }

        .drop-placeholder {
            height: 0.4rem;
            margin: 0.25rem 0;
            background: var(--primary);
            border-radius: 999px;
        }

        .composer {
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: 0.85rem;
            padding: 0.75rem;
            background: rgb(255 255 255 / 78%);
            border: 1px solid var(--border);
            border-radius: 0.85rem;
            opacity: 0.5;
        }

        .composer:hover {
            opacity: 0.9;
        }

        .composer-tabs {
            display: flex;
            gap: 0.35rem;
            margin-bottom: 0.65rem;
        }

        .composer-tab {
            flex: 1;
            padding: 0.45rem;
            color: var(--muted);
            background: transparent;
            border: 1px solid transparent;
            border-radius: 0.55rem;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .composer-tab.active {
            color: var(--primary);
            background: white;
            border-color: #cfd3ff;
        }

        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-bottom: 0.45rem;
        }

        .editor-toolbar button {
            min-width: 2rem;
            padding: 0.3rem 0.5rem;
            color: var(--text);
            background: white;
            border: 1px solid var(--border);
            border-radius: 0.45rem;
        }

        .editor {
            min-height: 7rem;
            max-height: 20rem;
            max-width: 18rem;
            padding: 0.65rem;
            overflow-y: auto;
            background: white;
            border: 1px solid var(--border);
            border-radius: 0.65rem;
            outline: 0;
            line-height: 1.45;
        }

        .editor:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgb(88 101 232 / 12%);
        }

        .editor:empty::before {
            color: #9aa1b1;
            content: attr(data-placeholder);
            pointer-events: none;
        }

        .photo-controls {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .file-button {
            position: relative;
            display: inline-block;
        }

        .photo-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .selected-photo {
            margin-top: 0.65rem;
        }

        .selected-photo img {
            display: block;
            width: 100%;
            max-height: 12rem;
            object-fit: contain;
            background: white;
            border-radius: 0.65rem;
        }

        .selected-photo-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-top: 0.45rem;
        }

        .composer-actions {
            margin-top: 0.7rem;
        }

        .empty-state {
            width: 100%;
            padding: 4rem 1rem;
            color: var(--muted);
            text-align: center;
        }

        .toast {
            position: fixed;
            right: 1rem;
            bottom: 1rem;
            z-index: 50;
            max-width: min(28rem, calc(100vw - 2rem));
            padding: 0.8rem 1rem;
            color: white;
            background: #252b3a;
            border-radius: 0.75rem;
            box-shadow: 0 12px 30px rgb(0 0 0 / 20%);
            opacity: 0;
            transform: translateY(1rem);
            transition: opacity 150ms ease, transform 150ms ease;
            pointer-events: none;
        }

        .toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            background: #267452;
        }

        .toast.error {
            background: #a92f46;
        }

        .transparent {
            opacity: 0.5;
        }

        .center {
            text-align: center;
        }

        @media (max-width: 500px) {
            .column {
                flex: 0 0 90%;
            }

            /* .toolbar {
                align-items: stretch;
                flex-wrap: wrap;
            }

            .toolbar-actions {
                width: 100%;
                margin-left: 0;
                overflow-x: auto;
            } */

            /* .board-header {
                flex-direction: column;
            } */

            /* .board-actions {
                width: 100%;
            } */

            .column {
                flex-basis: 88vw;
            }
        }
    </style>
</head>

<body>
    <header class="toolbar">
        <div class="toolbar-actions">
            <label class="board-picker">
                <button
                    type="button"
                    id="board-menu-button"
                    class="toolbar-actions-item button small"
                    aria-label="Choosw board"
                    aria-expanded="false"
                    aria-controls="board-menu"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    >
                        <path d="M4 6h16" />
                        <path d="M4 12h16" />
                        <path d="M4 18h16" />
                    </svg>
                </button>

                <select id="board-select" hidden></select>

                <ul id="board-menu" class="board-menu" hidden></ul>
            </label>
            <!-- <button id="new-board" class="toolbar-actions-item button small" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-label="Add board" role="img">
                  <path d="M12 5v14"/>
                  <path d="M5 12h14"/>
                </svg>
            </button>
            <button id="delete-board" class="toolbar-actions-item button small" type="button">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18" />
                    <path d="M8 6V4h8v2" />
                    <path d="m19 6-1 14H6L5 6" />
                    <path d="M10 11v5M14 11v5" />
                </svg>
            </button> -->
            <button id="toggle-theme" class="toolbar-actions-item button small" type="button">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    role="img"
                    aria-label="Theme palette"
                >
                    <path d="M12 3a9 9 0 1 0 0 18h1.2a2 2 0 0 0 1.5-3.3 1.7 1.7 0 0 1 1.3-2.8H18a3 3 0 0 0 3-3c0-5-4-8.9-9-8.9Z"/>
                    <circle cx="7.5" cy="11" r="1"/>
                    <circle cx="10" cy="7.5" r="1"/>
                    <circle cx="14" cy="7.5" r="1"/>
                    <circle cx="17" cy="10.5" r="1"/>
                </svg>
            </button>
            <button id="import-board" class="toolbar-actions-item button small" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                </svg>
            </button>
            <button id="export-board" class="toolbar-actions-item button small" type="button">
                <!-- <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M12 3v12"/>
                    <path d="m7 10 5 5 5-5"/>
                    <path d="M5 20h14"/>
                </svg> -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <path d="m8.59 13.51 6.83 3.98"/>
                    <path d="m15.41 6.51-6.82 3.98"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="app-shell">
        <section class="board-header">
            <div>
                <label class="sr-only" for="board-name">Board name</label>
                <input
                    id="board-name"
                    class="board-name"
                    type="text"
                    maxlength="120"
                    placeholder="Untitled board"
                >
                <p class="hint">
                    
                </p>
            </div>

            <div class="board-actions">
                <button id="add-column" class="button small" type="button">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-label="Add column"
                        role="img"
                        >
                        <rect x="3" y="4" width="11" height="16" rx="1.5" />
                        <path d="M8.5 4v16M17 12h5m-2.5-2.5v5" />
                    </svg>
                </button>
            </div>
        </section>

        <section id="columns" class="columns" aria-label="Board columns"></section>

        <br>
    </main>

    <input
        id="import-file"
        type="file"
        accept="application/json,.json"
        hidden
    >

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        "use strict";

        const STORAGE_KEY = "board-editor-v1";
        const STORAGE_KEY_DARK_THEME = "board-editor-v1-theme";
        const MAX_PHOTO_BYTES = 8 * 1024 * 1024;

        const ui = {
            boardSelect: document.getElementById("board-select"),
            boardMenuButton: document.getElementById("board-menu-button"),
            boardMenu: document.getElementById("board-menu"),
            boardName: document.getElementById("board-name"),
            // newBoard: document.getElementById("new-board"),
            importBoard: document.getElementById("import-board"),
            exportBoard: document.getElementById("export-board"),
            importFile: document.getElementById("import-file"),
            addColumn: document.getElementById("add-column"),
            // deleteBoard: document.getElementById("delete-board"),
            columns: document.getElementById("columns"),
            toast: document.getElementById("toast"),
            // downloadAppButton: document.getElementById("download-app"),
            toggleThemeButton: document.getElementById("toggle-theme")
        };

        let isDarkTheme = getThemeLocally();
        if (isDarkTheme === "1") {
            toggleTheme();
        }
        ui.toggleThemeButton.addEventListener("click", () => {
            toggleTheme();
            isDarkTheme = isDarkTheme === "1" ? "0" : "1";
            persistThemeOrWarn();
        })

        let boardData = loadBoardData();
        let currentBoardId = boardData.boards[0]?.id ?? null;
        let editingItem = null;
        let dragState = null;
        let toastTimer = null;
        let persistTimer = null;

        const pendingPhotos = new Map();
        const loadingPhotos = new Set();
        const photoReadVersions = new Map();

        function renderMenu() {
            ui.boardMenu.replaceChildren();

            Array.from(ui.boardSelect.options).forEach((option) => {
                const item = document.createElement("li");

                item.textContent = option.textContent;
                item.setAttribute(
                    "aria-selected",
                    String(option.value === ui.boardSelect.value)
                );

                item.addEventListener("click", () => {
                    ui.boardSelect.value = option.value;
                    ui.boardSelect.dispatchEvent(
                        new Event("change", { bubbles: true })
                    );

                    ui.boardMenu.hidden = true;
                    ui.boardMenuButton.setAttribute("aria-expanded", "false");
                });

                ui.boardMenu.appendChild(item);
            });

            let itemAdd = document.createElement("li");
            itemAdd.textContent = "✚ Add board";
            itemAdd.addEventListener("click", addBoard);
            ui.boardMenu.appendChild(itemAdd);

            const itemDelete = document.createElement("li");
            itemDelete.textContent = "✖ Delete current board";
            itemDelete.addEventListener("click", deleteBoard);
            ui.boardMenu.appendChild(itemDelete);
        }

        ui.boardMenuButton.addEventListener("click", () => {
            const isOpening = ui.boardMenu.hidden;

            if (isOpening) {
                renderMenu();
            }

            ui.boardMenu.hidden = !isOpening;
            ui.boardMenuButton.setAttribute("aria-expanded", String(isOpening));
        });

        // Close when clicking outside the menu
        document.addEventListener("click", (event) => {
            if (!event.target.closest(".board-picker")) {
                ui.boardMenu.hidden = true;
                ui.boardMenuButton.setAttribute("aria-expanded", "false");
            }
        });

        function makeId(prefix) {
            if (window.crypto && typeof window.crypto.randomUUID === "function") {
                return `${prefix}-${window.crypto.randomUUID()}`;
            }

            return `${prefix}-${Date.now().toString(36)}-${Math.random()
                .toString(36)
                .slice(2)}`;
        }

        function escapeHtml(value) {
            const entities = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            };

            return String(value).replace(/[&<>"']/g, character => entities[character]);
        }

        function isSafeLink(value) {
            if (!value) {
                return false;
            }

            try {
                const url = new URL(value, window.location.href);
                return ["http:", "https:", "mailto:", "tel:"].includes(url.protocol);
            } catch {
                return false;
            }
        }

        function isSafePhotoDataUrl(value) {
            return /^data:image\/(?:png|jpeg|jpg|gif|webp|avif);base64,[a-z0-9+/=\s]+$/i.test(
                String(value)
            );
        }

        function sanitizeRichText(html) {
            const parser = new DOMParser();
            const documentFragment = parser.parseFromString(String(html), "text/html");
            const allowedTags = new Set([
                "P",
                "DIV",
                "BR",
                "B",
                "STRONG",
                "I",
                "EM",
                "U",
                "A",
                "UL",
                "OL",
                "LI",
                "SPAN",
                "BLOCKQUOTE"
            ]);

            function cleanChildren(parent) {
                Array.from(parent.children).forEach(element => {
                    if (!allowedTags.has(element.tagName)) {
                        element.replaceWith(
                            documentFragment.createTextNode(element.textContent || "")
                        );
                        return;
                    }

                    Array.from(element.attributes).forEach(attribute => {
                        const isSafeAnchorHref =
                            element.tagName === "A" &&
                            attribute.name.toLowerCase() === "href";

                        if (!isSafeAnchorHref) {
                            element.removeAttribute(attribute.name);
                        }
                    });

                    if (element.tagName === "A") {
                        const href = (element.getAttribute("href") || "").trim();

                        if (isSafeLink(href)) {
                            element.setAttribute("href", href);
                            element.setAttribute("target", "_blank");
                            element.setAttribute("rel", "noopener noreferrer");
                        } else {
                            element.removeAttribute("href");
                            element.removeAttribute("target");
                            element.removeAttribute("rel");
                        }
                    }

                    cleanChildren(element);
                });
            }

            cleanChildren(documentFragment.body);
            return documentFragment.body.innerHTML;
        }

        function linkifyTextNodes(root) {
            const walker = document.createTreeWalker(
                root,
                NodeFilter.SHOW_TEXT,
                {
                    acceptNode(node) {
                        // Don't linkify text that's already inside a link or non-text element.
                        if (node.parentElement?.closest("a, script, style, textarea")) {
                            return NodeFilter.FILTER_REJECT;
                        }
                        return NodeFilter.FILTER_ACCEPT;
                    }
                }
            );

            const textNodes = [];
            while (walker.nextNode()) textNodes.push(walker.currentNode);

            const urlRegex = /\bhttps?:\/\/[^\s<]+/gi;

            for (const textNode of textNodes) {
                const text = textNode.nodeValue;
                const fragment = document.createDocumentFragment();
                let lastIndex = 0;
                let match;

                urlRegex.lastIndex = 0;

                while ((match = urlRegex.exec(text))) {
                    // Leave common closing punctuation outside the link.
                    const url = match[0].replace(/[),.!?;:]+$/, "");
                    if (!url) continue;

                    const start = match.index;
                    const end = start + url.length;

                    fragment.append(
                        document.createTextNode(text.slice(lastIndex, start))
                    );

                    const link = document.createElement("a");
                    link.href = url;
                    link.textContent = url;
                    fragment.append(link);

                    lastIndex = end;
                }

                if (lastIndex) {
                    fragment.append(document.createTextNode(text.slice(lastIndex)));
                    textNode.replaceWith(fragment);
                }
            }
        }

        function toSafeRichText(value) {
            const text = String(value ?? "");
            if (!text.trim()) return "";

            const looksLikeHtml =
                /<\/?(?:p|div|br|b|strong|i|em|u|a|ul|ol|li|blockquote)\b/i.test(text);

            const html = looksLikeHtml
                ? sanitizeRichText(text)
                : sanitizeRichText(
                    `<div>${escapeHtml(text).replace(/\r?\n/g, "<br>")}</div>`
                );

            const container = document.createElement("div");
            container.innerHTML = html;

            linkifyTextNodes(container);

            // Sanitize again so the generated markup also passes your sanitizer.
            return sanitizeRichText(container.innerHTML);
        }

        function uniqueId(preferred, prefix, usedIds) {
            let id = String(preferred ?? "").trim();

            if (!id) {
                id = makeId(prefix);
            }

            while (usedIds.has(id)) {
                id = makeId(prefix);
            }

            usedIds.add(id);
            return id;
        }

        function normalizeChild(rawChild, usedItemIds) {
            const child = rawChild && typeof rawChild === "object" ? rawChild : {};
            const id = uniqueId(child.id, "item", usedItemIds);

            if (child.type === "photo") {
                let content = String(
                    child.content ??
                    child.dataUrl ??
                    child.src ??
                    child.base64 ??
                    ""
                );

                if (
                    content &&
                    !content.startsWith("data:") &&
                    /^[a-z0-9+/=\s]+$/i.test(content)
                ) {
                    content = `data:image/jpeg;base64,${content.replace(/\s/g, "")}`;
                }

                return {
                    id,
                    type: "photo",
                    content: isSafePhotoDataUrl(content) ? content : "",
                    name: String(child.name ?? child.alt ?? "Photo")
                };
            }

            const content = child.content ?? child.html ?? child.text ?? "";

            return {
                id,
                type: "text",
                content: toSafeRichText(content)
            };
        }

        function normalizeData(rawData) {
            let sourceBoards = [];

            if (Array.isArray(rawData)) {
                sourceBoards = rawData;
            } else if (rawData && Array.isArray(rawData.boards)) {
                sourceBoards = rawData.boards;
            } else if (rawData && Array.isArray(rawData.columns)) {
                // Supports the original format:
                // { board: "New York", columns: [...] }
                sourceBoards = [rawData];
            }

            const usedBoardIds = new Set();

            const boards = sourceBoards.map((rawBoard, boardIndex) => {
                const board = rawBoard && typeof rawBoard === "object" ? rawBoard : {};
                const boardId = uniqueId(board.id, "board", usedBoardIds);
                const usedColumnIds = new Set();
                const usedItemIds = new Set();
                const sourceColumns = Array.isArray(board.columns) ? board.columns : [];

                const columns = sourceColumns.map((rawColumn, columnIndex) => {
                    const column =
                        rawColumn && typeof rawColumn === "object" ? rawColumn : {};

                    const columnId = uniqueId(
                        column.id,
                        "column",
                        usedColumnIds
                    );

                    const sourceChildren = Array.isArray(column.children)
                        ? column.children
                        : [];

                    return {
                        id: columnId,
                        title: String(
                            column.title ?? column.name ?? `Column ${columnIndex + 1}`
                        ),
                        children: sourceChildren.map(child =>
                            normalizeChild(child, usedItemIds)
                        )
                    };
                });

                return {
                    id: boardId,
                    name: String(
                        board.name ?? board.board ?? `Board ${boardIndex + 1}`
                    ),
                    columns
                };
            });

            return {
                version: 1,
                boards
            };
        }

        function loadBoardData() {

                    if (normalized.boards.length) {
                        return normalized;
                    }
                }
            } catch (error) {
                console.warn("Data could not be loaded.", error);
            }

            return createDefaultData();
        }

        function setComposerType(columnId, requestedType) {

            const type = requestedType === "photo" ? "photo" : "text";

            composer
                .querySelectorAll("[data-composer-type]")
                .forEach(button => {
                    const active = button.dataset.composerType === type;
                    button.classList.toggle("active", active);
                    button.setAttribute("aria-pressed", String(active));
                });

            composer.querySelectorAll("[data-panel]").forEach(panel => {
                panel.hidden = panel.dataset.panel !== type;
            });

        function bumpPhotoReadVersion(columnId) {
            const version = (photoReadVersions.get(columnId) ?? 0) + 1;
            photoReadVersions.set(columnId, version);
            return version;
        }

        function cancelPhotoReads() {
            const columnIds = new Set([
                ...pendingPhotos.keys(),
                ...loadingPhotos.keys()
            ]);

            columnIds.forEach(columnId => bumpPhotoReadVersion(columnId));
            pendingPhotos.clear();
            loadingPhotos.clear();
        }

        function updatePhotoPreview(columnId) {
            const composer = getComposer(columnId);

            if (!composer) {
                return;
            }

            const preview = composer.querySelector("[data-photo-preview]");
            const image = composer.querySelector("[data-photo-image]") || composer.querySelector("[data-photo-paste]");
            const name = composer.querySelector("[data-photo-name]");
            const photo = pendingPhotos.get(columnId);

            if (loadingPhotos.has(columnId)) {
                preview.hidden = true;
                name.textContent = "Loading photo...";
                return;
            }

            if (photo && isSafePhotoDataUrl(photo.dataUrl)) {
                image.src = photo.dataUrl;
                image.alt = photo.name || "Photo";
                name.textContent = photo.name || "Photo";
                preview.hidden = false;
            } else {
                image.removeAttribute("src");
                name.textContent = "Not selected";
                preview.hidden = true;
            }
        }

        function resetComposer(columnId) {
            const composer = getComposer(columnId);

            if (!composer) {
                return;
            }

            bumpPhotoReadVersion(columnId);
            pendingPhotos.delete(columnId);
            loadingPhotos.delete(columnId);

            const editor = composer.querySelector("[data-editor]");
            const fileInput = composer.querySelector("[data-photo-file]");
            const filePaste = composer.querySelector("[data-photo-paste]");
            const submitButton = composer.querySelector('button[type="submit"]');
            const cancelButton = composer.querySelector(
                '[data-action="cancel-edit"]'
            );

            editor.innerHTML = "";
            fileInput.value = "";
            filePaste.value = "";
            submitButton.textContent = "Add";
            cancelButton.hidden = true;

            editingItem = null;
            setComposerType(columnId, "text");
            updatePhotoPreview(columnId);
        }

        function focusEditorAtEnd(editor) {
            const range = document.createRange();
            range.selectNodeContents(editor);
            range.collapse(false);

            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            editor.focus();
        }

        function loadComposerForEdit(columnId, item) {
            resetComposer(columnId);
            editingItem = {
                columnId,
                itemId: item.id
            };

            const composer = getComposer(columnId);
            const editor = composer.querySelector("[data-editor]");
            const submitButton = composer.querySelector('button[type="submit"]');
            const cancelButton = composer.querySelector(
                '[data-action="cancel-edit"]'
            );

            const composerContent = composer.querySelector(".composer-content");
            composer.querySelector(".plus-icon").hidden = true;
            composer.querySelector(".minus-icon").hidden = false;
            composerContent.hidden = false;

            setComposerType(columnId, item.type);
            submitButton.textContent = "Save changes";
            cancelButton.hidden = false;

            if (item.type === "text") {
                editor.innerHTML = sanitizeRichText(item.content);
            } else {
                pendingPhotos.set(columnId, {
                    dataUrl: item.content,
                    name: item.name || "Photo"
                });
                updatePhotoPreview(columnId);
            }

            composer.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });

            window.requestAnimationFrame(() => {
                if (item.type === "text") {
                    focusEditorAtEnd(editor);
                }
            });

        function getSelectionRange(editor) {
            const selection = window.getSelection();

            if (!selection || selection.rangeCount === 0) {
                return null;
            }

            const range = selection.getRangeAt(0);

            if (!editor.contains(range.commonAncestorContainer)) {
                return null;
            }

            return range.cloneRange();
        }

        function restoreSelection(editor, range) {
            editor.focus();

            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);

            //     if (!link) {
            //         showToast("This link is not allowed.", "error");
            //         return;
            //     }

            //     restoreSelection(editor, range);
            //     document.execCommand("createLink", false, link);
            // }
            
            // else {
            //     restoreSelection(editor, range);
            //     document.execCommand(command, false);
            // }

            restoreSelection(editor, range);
            return document.execCommand(command, false);

            editor.focus();
        }

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);

                reader.readAsDataURL(file);
            });
        }

        async function handlePhotoFileChange(input) {
            const composer = input.closest(".composer");
            const columnId = composer.dataset.columnId;
            const file = input.files?.[0];

            handlePhotoChange(file, columnId);
        }

        async function handlePhotoChange(file, columnId) {
            if (!file) {
                updatePhotoPreview(columnId);
                return;
            }

            if (!file.type.startsWith("image/")) {
                input.value = "";
                showToast("No image detected in selection.", "error");
                return;
            }

            if (file.size > MAX_PHOTO_BYTES) {
                input.value = "";
                showToast("File size limit is 8 MB.", "error");
                return;
            }

            const version = bumpPhotoReadVersion(columnId);
            loadingPhotos.add(columnId);
            updatePhotoPreview(columnId);

            try {
                const dataUrl = await readFileAsDataUrl(file);

                if (photoReadVersions.get(columnId) !== version) {
                    return;
                }

                if (!isSafePhotoDataUrl(dataUrl)) {
                    throw new Error("Image format is not supported.");
                }

                pendingPhotos.set(columnId, {
                    dataUrl,
                    name: file.name
                });

                loadingPhotos.delete(columnId);
                updatePhotoPreview(columnId);
            } catch (error) {
                if (photoReadVersions.get(columnId) === version) {
                    loadingPhotos.delete(columnId);
                    updatePhotoPreview(columnId);
                }

                showToast("This photo could not be loaded.", "error");
            }
        }

        function saveComposer(columnId) {
            const board = getCurrentBoard();
            const column = getColumn(board, columnId);
            const composer = getComposer(columnId);

            if (!board || !column || !composer) {
                return;
            }

            const activeTypeButton = composer.querySelector(
                '[data-composer-type][aria-pressed="true"]'
            );

            const type = activeTypeButton?.dataset.composerType === "photo"
                ? "photo"
                : "text";

            const isEditing =
                editingItem?.columnId === columnId &&
                column.children.some(item => item.id === editingItem.itemId);

            let nextItem;

            if (type === "text") {
                const editor = composer.querySelector("[data-editor]");
                const plainText = editor.textContent
                    .replace(/\u00a0/g, " ")
                    .trim();

                if (!plainText) {
                    showToast("Please enter some text before saving.", "error");
                    editor.focus();
                    return;
                }

                nextItem = {
                    id: isEditing ? editingItem.itemId : makeId("item"),
                    type: "text",
                    content: sanitizeRichText(editor.innerHTML)
                };
            } else {
                if (loadingPhotos.has(columnId)) {
                    showToast("Please wait, the photo is still loading.", "error");
                    return;
                }

                const photo = pendingPhotos.get(columnId);

                if (!photo || !isSafePhotoDataUrl(photo.dataUrl)) {
                    showToast("Please reload this page.", "error");
                    return;
                }

                nextItem = {
                    id: isEditing ? editingItem.itemId : makeId("item"),
                    type: "photo",
                    content: photo.dataUrl,
                    name: photo.name
                };
            }

            if (isEditing) {
                const index = column.children.findIndex(
                    item => item.id === editingItem.itemId
                );

                if (index >= 0) {
                    column.children[index] = {
                        ...column.children[index],
                        ...nextItem
                    };
                } else {
                    column.children.push(nextItem);
                }
            } else {
                column.children.push(nextItem);
            }

            editingItem = null;
            pendingPhotos.delete(columnId);
            loadingPhotos.delete(columnId);

            commitAndRender(isEditing ? "Updated" : "Added");
        }

        function handleColumnsClick(event) {
            const button = event.target.closest("[data-action]");

            if (!button || !ui.columns.contains(button)) {
                return;
            }

            const action = button.dataset.action;

            if (action === "format") {
                const composer = button.closest(".composer");
                const formatButtons = document.querySelectorAll('button[data-command="' + button.dataset.command + '"');
                const wasFormatApplied = formatEditor(composer.dataset.columnId, button.dataset.command);
                const formats = ["bold", "italic", "underline"];
                if (wasFormatApplied) {
                    formats.forEach((format) => {
                        const formatButtonsFormat = document.querySelectorAll('button[data-command="' + format + '"');
                        formatButtonsFormat.forEach((formatButton) => {
                            const currentStateEnabled = document.queryCommandState(format);
                            if (currentStateEnabled) {
                                formatButton.classList.add("active");
                            } else {
                                formatButton.classList.remove("active");
                            }
                        });
                    });
                }
                return;
            }

            if (action === "composer-type") {
                const composer = button.closest(".composer");
                setComposerType(
                    composer.dataset.columnId,
                    button.dataset.composerType
                );
                return;
            }

            if (action === "clear-photo") {
                const composer = button.closest(".composer");
                const columnId = composer.dataset.columnId;

                bumpPhotoReadVersion(columnId);
                pendingPhotos.delete(columnId);
                loadingPhotos.delete(columnId);
                composer.querySelector("[data-photo-file]").value = "";
                composer.querySelector("[data-photo-paste]").value = "";
                updatePhotoPreview(columnId);
                return;
            }

            if (action === "cancel-edit") {
                const composer = button.closest(".composer");
                resetComposer(composer.dataset.columnId);
                return;
            }

            if (action === "edit-item") {
                const itemElement = button.closest(".item");
                const columnElement = button.closest(".column");
                const column = getColumn(
                    getCurrentBoard(),
                    columnElement.dataset.columnId
                );
                const item = column?.children.find(
                    child => child.id === itemElement.dataset.itemId
                );

                if (item) {
                    loadComposerForEdit(column.id, item);
                }
                return;
            }

            if (action === "delete-item") {
                const itemElement = button.closest(".item");
                const columnElement = button.closest(".column");
                const column = getColumn(
                    getCurrentBoard(),
                    columnElement.dataset.columnId
                );

                if (!column) {
                    return;
                }

                if (!window.confirm("Delete this item?")) {
                    return;
                }

                column.children = column.children.filter(
                    item => item.id !== itemElement.dataset.itemId
                );

                commitAndRender("Deleted");
                return;
            }

            if (action === "delete-column") {
                const columnElement = button.closest(".column");
                const board = getCurrentBoard();
                const column = getColumn(board, columnElement.dataset.columnId);

                if (!board || !column) {
                    return;
                }

                if (board.columns.length === 1) {
                    showToast(
                        "The board must have at least one column.",
                        "error"
                    );
                    return;
                }

                if (!window.confirm(`Delete “${column.title}” and all its items?`)) {
                    return;
                }

                board.columns = board.columns.filter(
                    currentColumn => currentColumn.id !== column.id
                );

                commitAndRender("Column deleted.");
            }

            if (action === "move-column-to-left") {
                const columnElement = button.closest(".column");
                const board = getCurrentBoard();
                const column = getColumn(board, columnElement.dataset.columnId);

                if (!board || !column) {
                    return;
                }

                if (board.columns.length === 1) {
                    showToast(
                        "There must be at least two columns to move one.",
                        "error"
                    );
                    return;
                }

                if (!window.confirm(`Move “${column.title}” one position to the left?`)) {
                    return;
                }

                console.log(board.columns);
                console.log(column.id);
                const columnToMove = board.columns.filter(
                    currentColumn => currentColumn.id === column.id
                )[0];

                const columnToMoveIndex = board.columns.indexOf(columnToMove);
                console.log(columnToMoveIndex);

                if (columnToMoveIndex > 0) {
                    [board.columns[columnToMoveIndex - 1], board.columns[columnToMoveIndex]] = [board.columns[columnToMoveIndex], board.columns[columnToMoveIndex - 1]];
                }

                commitAndRender("Column moved.");
            }

            if (action === "toggle-view-composer") {
                const composer = button.closest(".composer");
                const composerContent = composer.querySelector(".composer-content");
                composer.querySelector(".plus-icon").hidden = !composer.querySelector(".plus-icon").hidden;
                composer.querySelector(".minus-icon").hidden = !composer.querySelector(".minus-icon").hidden;
                composerContent.hidden = !composerContent.hidden;
                return;
            }
        }

        function handleColumnsInput(event) {
            const titleInput = event.target.closest("[data-column-title]");

            if (!titleInput) {
                return;
            }

            const columnElement = titleInput.closest(".column");
            const column = getColumn(
                getCurrentBoard(),
                columnElement.dataset.columnId
            );

            if (column) {
                column.title = titleInput.value;
                schedulePersist();
            }
        }

        function handleColumnsChange(event) {
            if (event.target.matches("[data-column-title]")) {
                flushScheduledPersist();
                return;
            }

            if (event.target.matches("[data-photo-file]")) {
                void handlePhotoFileChange(event.target);
            }
        }

        function handleColumnsSubmit(event) {
            event.preventDefault();
            saveComposer(event.target.dataset.columnId);
        }

        function handlePaste(event) {
            const editor = event.target.closest("[data-editor]");

            if (!editor) {
                return;
            }

            event.preventDefault();

            const html = event.clipboardData?.getData("text/html");
            const text = event.clipboardData?.getData("text/plain") ?? "";

            if (html) {
                document.execCommand(
                    "insertHTML",
                    false,
                    sanitizeRichText(html)
                );
            } else {
                document.execCommand("insertText", false, text);
            }
        }

        function handleDragStart(event) {
            const handle = event.target.closest(".drag-handle");

            if (!handle) {
                return;
            }

            const item = handle.closest(".item");
            const column = item.closest(".column");

            dragState = {
                itemId: item.dataset.itemId,
                columnId: column.dataset.columnId
            };

            item.classList.add("dragging");
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData(
                "text/plain",
                JSON.stringify(dragState)
            );
        }

        function handleDragOver(event) {
            const list = event.target.closest(".item-list");

            if (!list || !dragState) {
                return;
            }

            event.preventDefault();
            event.dataTransfer.dropEffect = "move";

            let placeholder = ui.columns.querySelector(".drop-placeholder");

            if (!placeholder) {
                placeholder = document.createElement("li");
                placeholder.className = "drop-placeholder";
                placeholder.setAttribute("aria-hidden", "true");
            }

            const candidates = Array.from(
                list.querySelectorAll(".item:not(.dragging)")
            );

            const itemAfterCursor = candidates.find(item => {
                const bounds = item.getBoundingClientRect();
                return event.clientY < bounds.top + bounds.height / 2;
            });

            if (itemAfterCursor) {
                list.insertBefore(placeholder, itemAfterCursor);
            } else {
                list.appendChild(placeholder);
            }
        }

        function handleDrop(event) {
            const list = event.target.closest(".item-list");

            if (!list || !dragState) {
                return;
            }

            event.preventDefault();

            const board = getCurrentBoard();
            const sourceColumn = getColumn(board, dragState.columnId);
            const targetColumn = getColumn(board, list.dataset.columnId);

            if (!sourceColumn || !targetColumn) {
                cleanupDrag();
                return;
            }

            let placeholder = list.querySelector(".drop-placeholder");

            if (!placeholder) {
                placeholder = document.createElement("li");
                placeholder.className = "drop-placeholder";
                list.appendChild(placeholder);
            }

            const itemElements = Array.from(
                list.querySelectorAll(".item")
            );
            const nextElement = placeholder.nextElementSibling;

            let targetIndex = nextElement
                ? itemElements.indexOf(nextElement)
                : itemElements.length;

            if (targetIndex < 0) {
                targetIndex = itemElements.length;
            }

            const sourceIndex = sourceColumn.children.findIndex(
                item => item.id === dragState.itemId
            );

            if (sourceIndex < 0) {
                cleanupDrag();
                return;
            }

            const [movedItem] = sourceColumn.children.splice(sourceIndex, 1);

            if (
                sourceColumn.id === targetColumn.id &&
                sourceIndex < targetIndex
            ) {
                targetIndex -= 1;
            }

            targetColumn.children.splice(
                Math.max(0, Math.min(targetIndex, targetColumn.children.length)),
                0,
                movedItem
            );

            cleanupDrag();
            commitAndRender("Order updated");
        }

        function cleanupDrag() {
            dragState = null;

            ui.columns
                .querySelectorAll(".dragging")
                .forEach(item => item.classList.remove("dragging"));

            ui.columns
                .querySelectorAll(".drop-placeholder")
                .forEach(placeholder => placeholder.remove());
        }

        function addBoard() {
            const suggestedName = `Board ${boardData.boards.length + 1}`;
            const enteredName = window.prompt("New board name:", suggestedName);

            if (enteredName === null) {
                return;
            }

            const board = {
                id: makeId("board"),
                name: enteredName.trim() || suggestedName,
                columns: [
                    {
                        id: makeId("column"),
                        title: "Column 1",
                        children: []
                    }
                ]
            };

            boardData.boards.push(board);
            currentBoardId = board.id;
            editingItem = null;
            cancelPhotoReads();

            commitAndRender("Board created");
        }

        function deleteBoard() {
            const board = getCurrentBoard();

            if (!board) {
                return;
            }

            if (boardData.boards.length <= 1) {
                showToast(
                    "There must be at least one board. You can add another first.",
                    "error"
                );
                return;
            }

            if (!window.confirm(`Delete the board “${board.name}”?`)) {
                return;
            }

            const index = boardData.boards.findIndex(
                currentBoard => currentBoard.id === board.id
            );

            boardData.boards.splice(index, 1);
            currentBoardId =
                boardData.boards[index]?.id ??
                boardData.boards[index - 1]?.id ??
                null;

            editingItem = null;
            cancelPhotoReads();

            commitAndRender("Board deleted");
        }

        function addColumn() {
            const board = getCurrentBoard();

            if (!board) {
                return;
            }

            const suggestedTitle = `Column ${board.columns.length + 1}`;
            const enteredTitle = window.prompt(
                "New column name:",
                suggestedTitle
            );

            if (enteredTitle === null) {
                return;
            }

            board.columns.push({
                id: makeId("column"),
                title: enteredTitle.trim() || suggestedTitle,
                children: []
            });

            commitAndRender("Column added");
        }

        function importBoard() {
            const ok = confirm("Import from JSON file? Boards will be added to current ones");
            if (ok) {
                ui.importFile.value = "";
                ui.importFile.click();
            }
        }

        async function handleImportFile(event) {
            const file = event.target.files?.[0];

            if (!file) {
                return;
            }

            try {
                const rawData = JSON.parse(await file.text());
                const normalized = normalizeData(rawData);

                if (!normalized.boards.length) {
                    throw new Error("The file does not contain boards.");
                }

                normalized.boards = boardData.boards.concat(normalized.boards);

                boardData = normalized;
                currentBoardId = boardData.boards[0].id;
                editingItem = null;
                cancelPhotoReads();

                commitAndRender("Data imported");
            } catch (error) {
                showToast(
                    `Error while importing: ${error.message}`,
                    "error"
                );
            } finally {
                ui.importFile.value = "";
            }
        }

        function exportBoard() {
            const ok = confirm("Export boards to a JSON file? It will be saved in Downloads");
            if (ok) {
                const json = JSON.stringify(boardData, null, 2);
                const blob = new Blob([json], {
                    type: "application/json"
                });

                if (window.AndroidBridge) {
                    window.AndroidBridge.downloadJson(
                        typeof json === "string" ? json : JSON.stringify(json)
                    );
                } else {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    const date = new Date().toISOString();
                    const dateText = date.slice(0, 10).toString() + "_boards_" + date.slice(11, 19).toString().replaceAll(":", "-");

                    link.href = url;
                    link.download = `${dateText}.json`;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();

                    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
                    showToast("All boards were exported.", "success");
                }
            }
        }

        function updateUI(nextData) {
            if (nextData !== undefined) {
                const previousBoardId = currentBoardId;

                boardData = normalizeData(nextData);
                currentBoardId =
                    boardData.boards.find(
                        board => board.id === previousBoardId
                    )?.id ??
                    boardData.boards[0]?.id ??
                    null;

                editingItem = null;
                cancelPhotoReads();

                const stored = saveLocally();
                render();

                if (!stored) {
                    showStorageWarning();
                }

                return;
            }

            render();
        }

        ui.boardSelect.addEventListener("change", event => {
            currentBoardId = event.target.value;
            editingItem = null;
            cancelPhotoReads();
            render();
        });

        ui.boardName.addEventListener("input", () => {
            const board = getCurrentBoard();

            if (!board) {
                return;
            }

            board.name = ui.boardName.value;

            const selectedOption = ui.boardSelect.selectedOptions[0];

            if (selectedOption) {
                selectedOption.textContent =
                    board.name || "Untitled board";
            }

            schedulePersist();
        });

        ui.boardName.addEventListener("change", flushScheduledPersist);
        // ui.newBoard.addEventListener("click", addBoard);
        // ui.deleteBoard.addEventListener("click", deleteBoard);
        ui.addColumn.addEventListener("click", addColumn);
        ui.importBoard.addEventListener("click", importBoard);
        ui.exportBoard.addEventListener("click", exportBoard);
        ui.importFile.addEventListener("change", handleImportFile);

        ui.columns.addEventListener("click", handleColumnsClick);
        ui.columns.addEventListener("input", handleColumnsInput);
        ui.columns.addEventListener("change", handleColumnsChange);
        ui.columns.addEventListener("submit", handleColumnsSubmit);
        ui.columns.addEventListener("paste", handlePaste);

        ui.columns.addEventListener("mousedown", event => {
            if (event.target.closest('[data-action="format"]')) {
                // Prevent the toolbar from removing the editor selection.
                event.preventDefault();
            }
        });

        ui.columns.addEventListener("dragstart", handleDragStart);
        ui.columns.addEventListener("dragover", handleDragOver);
        ui.columns.addEventListener("drop", handleDrop);
        ui.columns.addEventListener("dragend", cleanupDrag);

        window.updateUI = updateUI;
        window.importBoard = importBoard;
        window.exportBoard = exportBoard;

        Object.defineProperty(window, "data", {
            configurable: true,
            get() {
                return boardData;
            },
            set(value) {
                updateUI(value);
            }
        });

        render();

        const pasteButtons = document.getElementsByClassName("paste-button");
        for (let pasteButton of pasteButtons) {
            pasteButton.addEventListener("click", async () => {
                const composer = pasteButton.closest(".composer");
                const columnId = composer.dataset.columnId;
                try {
                    if (!navigator.clipboard?.read) {
                        showToast(
                            `Not compatible`,
                            "error"
                        );
                    }

                    const items = await navigator.clipboard.read();

                    for (const item of items) {
                        const imageType = item.types.find(type =>
                            type.startsWith("image/")
                        );

                        if (imageType) {
                            const blob = await item.getType(imageType);
                            handlePhotoChange(blob, columnId);
                            return;
                        }
                    }

                    showToast(
                        `No image found on clipboard`,
                        "error"
                    );
                } catch (error) {
                    // Clipboard access may be denied or unavailable.
                }
            });
        };
    </script>
</body>
